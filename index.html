<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Motorcycle Fleet Tracker</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
        }

        .top-bar{
            padding:10px;
            background:#1f2937;
            color:white;
        }

        input{
            padding:8px;
            margin:5px;
        }

        button{
            padding:10px 15px;
            background:#16a34a;
            color:white;
            border:none;
            cursor:pointer;
        }

        #map{
            height:90vh;
        }
    </style>
</head>

<body>

<div class="top-bar">

    <h2>Motorcycle Fleet Tracker</h2>

    <input
        type="text"
        id="rider"
        placeholder="Rider Name">

    <input
        type="text"
        id="bike"
        placeholder="Bike Number">

    <button onclick="startTracking()">
        Start Shift
    </button>

    <span id="status">
        Waiting...
    </span>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView(
[-26.2041,28.0473],
13
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap contributors'
}
).addTo(map);

let riderMarker;

navigator.geolocation.watchPosition(

function(position){

    let lat = position.coords.latitude;
    let lng = position.coords.longitude;

    console.log(lat,lng);

    if(!riderMarker){

        riderMarker = L.marker([lat,lng])
        .addTo(map)
        .bindPopup("Rider");

    }
    else{

        riderMarker.setLatLng([lat,lng]);

    }

    map.setView([lat,lng],16);

},

function(error){

    alert("Please allow GPS access");

},

{
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:10000
}

);

</script>

</body>
</html>
