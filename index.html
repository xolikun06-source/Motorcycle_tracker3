<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motorcycle Fleet Tracker</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

.top-bar{
    background:#1f2937;
    color:white;
    padding:15px;
}

input{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 15px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

#status{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

#map{
    height:85vh;
    width:100%;
}

</style>

</head>

<body>

<div class="top-bar">

<h2>Motorcycle Fleet Tracker</h2>

<input
type="text"
id="rider"
placeholder="Rider Name">

<input
type="text"
id="bike"
placeholder="Bike Number">

<button onclick="startTracking()">
Start Shift
</button>

<span id="status">
Waiting...
</span>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const SUPABASE_URL =
"https://myxyywetqldnlyfagdvb.supabase.co/rest/v1/Riders_location";

const SUPABASE_KEY =
"sb_publishable_KVnIXvi2mSWMotrS_mjbIw_qBhRJY2_";

var map = L.map('map').setView(
[-26.2041,28.0473],
13
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap'
}
).addTo(map);

let riderMarker;

function startTracking(){

    const rider =
    document.getElementById("rider").value;

    const bike =
    document.getElementById("bike").value;

    if(!rider || !bike){

        alert(
        "Please enter Rider Name and Bike Number"
        );

        return;
    }

    document.getElementById("status").innerText =
    "Starting GPS...";

    navigator.geolocation.watchPosition(

        async function(position){

            let lat =
            position.coords.latitude;

            let lng =
            position.coords.longitude;

            document.getElementById("status").innerText =
            "Tracking Active";

            if(!riderMarker){

                riderMarker =
                L.marker([lat,lng])
                .addTo(map)
                .bindPopup(
                    rider + " (" + bike + ")"
                )
                .openPopup();

            }else{

                riderMarker.setLatLng(
                    [lat,lng]
                );

            }

            map.setView(
                [lat,lng],
                16
            );

            try{

                const response =
                await fetch(
                    SUPABASE_URL,
                    {
                        method:"POST",

                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                            "Bearer " + SUPABASE_KEY,
                            "Content-Type":
                            "application/json",
                            "Prefer":
                            "return=representation"
                        },

                        body:JSON.stringify({

                            Rider_name:rider,
                            Bike_number:bike,
                            Latitude:lat,
                            Longitude:lng,
                            Timestamp:new Date().toISOString()

                        })

                    }
                );

                const result =
                await response.text();
                alert("Supabase says: " + result);

                console.log(
                    "Supabase Response:",
                    result
                );

                console.log(
                    "Location Saved"
                );

            }
            catch(error){

                console.error(
                "Supabase Error:",
                error
                );

            }

        },

        function(error){

            document.getElementById("status").innerText =
            "GPS Error";

            alert(
                "GPS Error: " +
                error.message
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}

</script>

</body>
</html>
