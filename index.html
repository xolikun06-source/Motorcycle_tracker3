<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Motorcycle Fleet Tracker</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
        }

        .top-bar{
            padding:10px;
            background:#1f2937;
            color:white;
        }

        input{
            padding:8px;
            margin:5px;
        }

        button{
            padding:10px 15px;
            background:#16a34a;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        #map{
            height:90vh;
            width:100%;
        }

        #status{
            margin-left:10px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="top-bar">

    <h2>Motorcycle Fleet Tracker</h2>

    <input
        type="text"
        id="rider"
        placeholder="Rider Name">

    <input
        type="text"
        id="bike"
        placeholder="Bike Number">

    <button onclick="startTracking()">
        Start Shift
    </button>

    <span id="status">
        Waiting...
    </span>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// Create map
var map = L.map('map').setView(
    [-26.2041, 28.0473],
    13
);

// Add OpenStreetMap layer
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

// Marker variable
let riderMarker;

// Start tracking function
function startTracking() {

    // Test to make sure button works
    alert("Start Shift clicked");

    document.getElementById("status").innerText =
    "Starting GPS...";

    navigator.geolocation.getCurrentPosition(

        function(position){

            let lat = position.coords.latitude;
            let lng = position.coords.longitude;

            document.getElementById("status").innerText =
            "Tracking Active";

            // Remove old marker if exists
            if(riderMarker){
                map.removeLayer(riderMarker);
            }

            riderMarker = L.marker([lat,lng])
                .addTo(map)
                .bindPopup("Current Rider Location")
                .openPopup();

            map.setView([lat,lng],16);

            console.log("Latitude:", lat);
            console.log("Longitude:", lng);

        },

        function(error){

            document.getElementById("status").innerText =
            "GPS Error";

            alert(
                "GPS Error: " + error.message
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}

</script>

</body>
</html>
